<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <!-- Outer Crest & Emblem -->
  <g transform="translate(10, 10)">
    <!-- Decorative Shield / Seal Background -->
    <circle cx="50" cy="50" r="48" fill="#143823" stroke="#D4AF37" stroke-width="2.5" />
    <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,3" opacity="0.7" />
    
    <!-- Central Botanical Spice / Grain Sheaf / Leaf Artwork -->
    <path d="M50 20 C50 35 34 45 34 60 C34 72 42 78 50 82 C58 78 66 72 66 60 C66 45 50 20 50 20 Z" fill="#D4AF37" opacity="0.95" />
    <!-- Center Vein -->
    <path d="M50 22 L50 80" stroke="#143823" stroke-width="2" stroke-linecap="round" />
    <!-- Side Flourishes / Spices -->
    <path d="M50 40 Q38 48 36 56" stroke="#143823" stroke-width="1.5" stroke-linecap="round" />
    <path d="M50 40 Q62 48 64 56" stroke="#143823" stroke-width="1.5" stroke-linecap="round" />
    <path d="M50 54 Q40 60 40 68" stroke="#143823" stroke-width="1.5" stroke-linecap="round" />
    <path d="M50 54 Q60 60 60 68" stroke="#143823" stroke-width="1.5" stroke-linecap="round" />
    <!-- Star on top of leaf -->
    <polygon points="50,14 52,18 56,18 53,20 54,24 50,22 46,24 47,20 44,18 48,18" fill="#F4D03F" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 22)">
    <!-- Top Sub-Header -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="4.5" fill="#B88629">
      SOANS HOME INDUSTRIES • ESTD. 1982
    </text>
    
    <!-- Main Brand Name -->
    <text x="0" y="58" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="2" fill="#143823">
      NS SOANS
    </text>
    
    <!-- Secondary Tagline -->
    <text x="180" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-style="italic" font-weight="600" fill="#B83318">
      Indian Farm
    </text>

    <!-- Bottom Origin Tag -->
    <text x="2" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" fill="#6B5141">
      KUNDAPURA TRADITIONAL SPICES &amp; ORGANIC HARVEST
    </text>
  </g>
</svg>

